# /etc/nginx/conf.d/laboratorios-limits.conf (dentro del contexto http).
# Las consultas GET y el calendario no consumen intentos de acceso.
map $request_method $laboratorios_acceso_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $laboratorios_acceso_key zone=laboratorios_acceso:10m rate=30r/m;
# No registrar URI, query string, IP, cookies ni datos del formulario.
log_format laboratorios_privado '$time_iso8601 $request_method $status $request_time';
