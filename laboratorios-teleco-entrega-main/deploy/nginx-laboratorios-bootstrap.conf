# Temporal: permite emitir el certificado sin exponer el formulario por HTTP.
server {
    listen 80;
    server_name lab.ejemplo.edu.co;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 503 "Sitio en preparacion.\n";
        add_header Content-Type text/plain always;
        add_header Retry-After 600 always;
    }
}
