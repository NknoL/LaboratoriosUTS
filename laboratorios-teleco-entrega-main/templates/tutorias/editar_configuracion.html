{% extends "tutorias/base.html" %}
{% block title %}{{ titulo }} | Laboratorios UTS{% endblock %}
{% block content %}
    <a class="back-link"
       href="{% if url_volver %}{{ url_volver }}{% else %}{% url 'configurar' tipo %}{% endif %}"><i data-lucide="arrow-left"></i>Configuración</a>
    <header class="page-title">
        <div>
            <span class="section-label">
                {% if obj %}
                    Editar
                {% else %}
                    Nuevo registro
                {% endif %}
            </span>
            <h1>{{ titulo }}</h1>
        </div>
    </header>
    <form method="post" class="form-surface">
        {% csrf_token %}
        {% include "tutorias/fields.html" %}
        <div class="form-actions">
            <a href="{% if url_volver %}{{ url_volver }}{% else %}{% url 'configurar' tipo %}{% endif %}"
               class="btn btn-outline-primary">Volver</a>
            <button class="btn btn-primary">
                <i data-lucide="save"></i>
                {% if copiar %}
                    Copiar horarios
                {% else %}
                    Guardar
                {% endif %}
            </button>
        </div>
    </form>
{% endblock %}
